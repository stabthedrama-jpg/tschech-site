<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deep Roots | Professional Survey</title>
<style>
:root{--paper:#f7f1e6;--ink:#1e2822;--muted:#667067;--green:#244b38;--green2:#56715f;--line:rgba(30,40,34,.14);--card:rgba(255,255,255,.6)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 70% 0,rgba(86,113,95,.12),transparent 36%),var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.6}
.shell{width:min(1080px,calc(100% - 30px));margin:auto}.top{min-height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:24px}.tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.eyebrow{margin:0 0 10px;color:var(--green2);font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:500}h1{font-size:clamp(48px,8vw,78px);line-height:1;margin:0 0 20px;letter-spacing:-.04em}
h2{font-size:clamp(32px,5vw,48px);line-height:1.05;margin:0 0 14px}.lead{max-width:720px;color:var(--muted);font-size:19px;margin:0 0 28px}
.btn{display:inline-block;padding:13px 18px;border-radius:999px;border:1px solid var(--green);text-decoration:none;font-weight:800;color:var(--green);margin-right:8px}.btn.primary{background:var(--green);color:white}
.section{padding:54px 0;border-top:1px solid var(--line)}.hero{padding:72px 0 56px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}.card{padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--card)}.card h3{margin:0 0 8px;font-size:24px}.card p{margin:0;color:var(--muted)}
.research{padding:30px;border-radius:24px;background:var(--green);color:white;margin:20px 0 58px}.research p{color:rgba(255,255,255,.82)}.research .btn{border-color:white;color:white}.research .btn.primary{background:white;color:var(--green)}
.back{color:var(--green);text-decoration:none;font-weight:700}.form-intro{padding:48px 0 12px}.form-wrap{padding:10px 0 60px}iframe{display:block;width:100%;border:0;background:transparent}
footer{padding:28px 0 44px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{padding-top:52px}.tag{display:none}}
</style>
</head><body><div class="shell">
<header class="top"><div class="brand">Deep Roots</div><a class="back" href="/deeproots/">← Deep Roots</a></header>
<main><section class="form-intro"><p class="eyebrow">Challenge the model</p><h1>Professional Survey</h1><p class="lead">We’re developing a private-pay, nurse-led aging-in-place service and want clinicians and community professionals to challenge the model before launch.</p></section>
<section class="form-wrap"><iframe data-tally-src="https://tally.so/embed/jaAKza?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" loading="lazy" width="100%" height="1000" frameborder="0" marginheight="0" marginwidth="0" title="Deep Roots Professional Survey"></iframe></section></main>
<footer>Deep Roots · Home Independence &amp; Safety · Fox Valley, Wisconsin</footer></div><script async src="https://tally.so/widgets/embed.js"></script></body></html>
