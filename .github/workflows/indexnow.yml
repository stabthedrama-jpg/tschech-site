name: Notify search engines
on:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/protest/**'
      - 'public/sitemap.xml'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indexnow
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Submit the homepage and music blog to IndexNow
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          key = "dff4305e483886ca4174072bb4788b38"
          key_url = f"https://tschech.co/{key}.txt"
          headers = {"User-Agent": "TSCHECH-IndexNow/1.0"}
          with urllib.request.urlopen(urllib.request.Request(key_url, headers=headers), timeout=30) as response:
              if response.read().decode("utf-8").strip() != key:
                  raise RuntimeError("The published IndexNow key does not match.")
          payload = {
              "host": "tschech.co",
              "key": key,
              "keyLocation": key_url,
              "urlList": ["https://tschech.co/", "https://tschech.co/protest/"],
          }
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode("utf-8"),
              headers={**headers, "Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              status = response.status
              response.read()
          if status not in (200, 202):
              raise RuntimeError(f"Unexpected IndexNow response: HTTP {status}")
          message = "submitted successfully" if status == 200 else "received; key validation pending"
          print(f"IndexNow HTTP {status}: {message}.")
          print("Receipt does not guarantee indexing.")
          PY
